name: Seed database

on:
  workflow_dispatch:

jobs:
  seed_db:
    runs-on: ubuntu-latest

    steps:
      - name: Seed database
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ vars.VM_USERNAME }}/neswear-deploy
            docker compose exec -T backend npm run seed
